[package]
name = "llm-client"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
thiserror = "1.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "std",
] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
bon = "3.10.3"
