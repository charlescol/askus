[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
actix-web = "4"
thiserror = "2.0"
tracing-appender = "0.2"
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "=9.0.2", features = ["actix-web", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
